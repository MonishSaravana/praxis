[project]
name = "praxis"
version = "0.1.0"
description = "Praxis prototype v0: a layered real-time task-state engine for first-person procedural coaching. Instructions that can finally see how you're doing."
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.5",
    "torchvision",
    "transformers>=4.53",
    "accelerate",
    "safetensors",
    "huggingface_hub",
    "mediapipe>=0.10.14",
    "opencv-python",
    "pillow",
    "numpy",
    "scipy",
    "scikit-learn",
    "pandas",
    "matplotlib",
    "tqdm",
    "anthropic",
    "httpx",
    "pydantic>=2",
    "python-dotenv",
    "pyyaml",
    "einops",
    "av",
    "requests",
    "fastapi>=0.143.3",
    "uvicorn[standard]>=0.54.0",
    "python-multipart>=0.0.32",
]

[project.scripts]
praxis = "praxis.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["praxis"]
